<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Every link and image path on the site starts from the top folder of
       the site because of this line. That's why you can write
       src="images/photo.jpg" on any page, even blog posts. Don't remove it. -->
  <base href="{{ '/' | relative_url }}">

  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip | escape }}">

  <!-- Your logo in the browser tab (set "favicon" in _config.yml) -->
  <link rel="icon" href="{{ site.favicon }}">
  <link rel="apple-touch-icon" href="{{ site.logo }}">

  <!-- Fonts: Cinzel (fancy ancient capitals) and Noto Sans Cuneiform (wedge-shaped ornaments) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;700;900&family=Noto+Sans+Cuneiform&display=swap">

  <link rel="stylesheet" href="css/site.css?v={{ site.time | date: '%s' }}">

  <!-- Settings handed from _config.yml to the JavaScript.
       Change them in _config.yml, not here. -->
  <script>
    window.SITE = {
      title: {{ site.title | jsonify }},
      pastShowsOrder: {{ site.past_shows_order | default: "oldest_first" | jsonify }},
      currencySymbol: {{ site.currency_symbol | default: "$" | jsonify }},
      carouselSeconds: {{ site.carousel_seconds | default: 5 | jsonify }},
      defaultPoster: {{ site.default_poster | jsonify }},
      defaultBandLogo: {{ site.default_band_logo | jsonify }},
      version: "{{ site.time | date: '%s' }}"
    };
  </script>
</head>
<body>

{% include header.html %}

<div id="main" class="container">
{{ content }}
</div>

{% include footer.html %}

<script src="js/templates.js?v={{ site.time | date: '%s' }}"></script>
<script src="js/site.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
